# Memex docker-compose stack — memex-server + (optional) Ollama for local embeddings.
#
# Usage:
#   docker compose up -d
#   curl localhost:19420/health
#
# Ollama service is included so this is fully self-contained on a fresh host.
# If you already run Ollama on the host, you can omit the ollama service and set
# MEMEX_OLLAMA_URL=http://host.docker.internal:11434 in memex-server's environment.
# (Legacy COGITO_OLLAMA_URL is still honored by config._ENV_MAP.)

services:
  memex-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: memex:0.3.0rc1
    container_name: memex-server
    ports:
      - "127.0.0.1:19420:19420"
    volumes:
      - memex-data:/data
    environment:
      MEMEX_ENTRYPOINT: "http"
      MEMEX_PORT: "19420"
      MEMEX_OLLAMA_URL: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:19420/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: memex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  memex-data:
    driver: local
  ollama-data:
    driver: local
