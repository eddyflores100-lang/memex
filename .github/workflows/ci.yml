name: CI

# Hermetic CI for the current Memex release: runs on fresh Ubuntu and macOS runners. Proves the
# memex package installs cleanly from source on a box that has never seen it
# before — the equivalent of a beta tester installing the tagged source. Tests
# that require a live Ollama or LLM endpoint are excluded by directory; the
# rest (~370) must pass on every commit.
#
# What this catches:
#   - missing dependencies (e.g. the `ollama` python lib that crashed our
#     fresh-venv smoke test before we added it to pyproject)
#   - macOS-only or Linux-only path bugs
#   - Python-version regressions across 3.10 through 3.14
#   - lint regressions
#   - silent test-collection failures
#
# What this does NOT catch (intentionally — handled by manual smoke):
#   - live Ollama embedding behaviour (tests/scaffold/test_e2e_store_query.py)
#   - LLM backend portability (tests/scaffold/test_backend_portability.py)
#   - Anthropic / OpenAI streaming wire format

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install memex (proves clean install)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify console scripts are wired
        run: |
          memex --help

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Guard against operator-path leaks
        run: |
          # The operator's login legitimately appears in repository URLs,
          # contact emails, and manifests — what must NOT appear is the
          # login embedded in a filesystem path (a leaked dev-machine
          # path, e.g. /Users/<login>/...). Placeholder paths are the fix.
          if git grep -nE '/(Users|home)/eddyflores100-lang' -- ':!.git' \
              ':!.github/workflows/ci.yml' ':!.pre-commit-config.yaml'; then
            echo "::error::Found the operator's login inside a filesystem path (see matches above). Use a placeholder like /Users/testuser/ instead."
            exit 1
          fi

      - name: Pytest (CI-runnable suite)
        env:
          MEMEX_QUEUE_DIR: ${{ runner.temp }}/memex-ci-queue
        run: |
          # The chromadb-backed tests hold one persistent client per test;
          # the runner's default soft fd limit (1024) is exhausted late in
          # the suite. Raise it for the pytest process only.
          ulimit -n 4096 2>/dev/null || true
          pytest tests/ \
            --ignore=tests/scaffold/test_e2e_store_query.py \
            --ignore=tests/scaffold/test_backend_portability.py \
            --ignore=tests/scaffold/test_anthropic_cache_wire.py \
            --ignore=tests/scaffold/test_openai_format_compatibility.py \
            --ignore=tests/scaffold/test_streaming_marker_integrity.py \
            -q --no-header --tb=line

      - name: Smoke — package metadata sanity
        run: |
          python -c "import memex; assert memex.__version__, 'no version'; print('version:', memex.__version__)"
          python -c "from memex import degrade, server, init_cmd, watch_cmd, mcp_server; print('imports OK')"

      - name: Smoke — plist contents test (macOS-only behaviour)
        if: runner.os == 'macOS'
        run: |
          pytest tests/test_init_plist_contents.py -v --no-header

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t memex:ci .

      - name: Smoke — package importable inside image
        run: docker run --rm memex:ci python -c "import memex; print('memex', memex.__version__)"

      - name: Smoke — MCP stdio initialize round-trip (default entrypoint)
        run: |
          resp=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-probe","version":"0.0.0"}}}' \
            | timeout 300 docker run -i --rm memex:ci) || true
          if ! echo "$resp" | grep -q '"serverInfo"'; then
            echo "::error::MCP initialize round-trip failed (no serverInfo in response)."
            echo "Response was: ${resp:-<empty>}"
            exit 1
          fi
          echo "MCP initialize round-trip OK"

      - name: Smoke — HTTP server boots without Ollama (compose mode)
        run: |
          docker run -d --name memex-http \
            -e MEMEX_ENTRYPOINT=http -p 127.0.0.1:19420:19420 memex:ci
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19420/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::HTTP /live never became reachable within 120s"
            docker logs memex-http || true
            docker rm -f memex-http >/dev/null 2>&1 || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:19420/live | grep -q '"alive"' \
            || { echo "::error::/live did not report status alive"; docker logs memex-http || true; exit 1; }
          curl -fsS http://127.0.0.1:19420/health | grep -q '"status"' \
            || { echo "::error::/health did not report a status object"; docker logs memex-http || true; exit 1; }
          echo "HTTP boot OK — serving /live + /health with no Ollama reachable (lazy MemoryHolder)."
          docker rm -f memex-http >/dev/null 2>&1 || true

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          pip install --upgrade pip build
          python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memex-dist
          path: dist/
          retention-days: 14
