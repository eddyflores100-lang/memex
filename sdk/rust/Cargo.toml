[package]
name = "memex-sdk"
version = "0.3.0"
edition = "2021"
license = "AliceLabs Proprietary v1.0"
description = "Memex — local-first, zero-LLM agent memory SDK for Rust"
authors = ["AliceLabs <eddyflores100-lang@users.noreply.github.com>"]
repository = "https://github.com/eddyflores100-lang/memex"
keywords = ["memex", "agent-memory", "zero-llm", "rag", "retrieval"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }

[lib]
name = "memex"
path = "src/lib.rs"
