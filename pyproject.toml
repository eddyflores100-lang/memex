[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. The import package and CLI stay `memex`
# (hatch builds packages = ["src/memex"]); `memex-memory` is what
# server.json, the Claude plugin, and the Gemini extension pin.
name = "memex-memory"
version = "0.3.0rc1"
description = "Memex — local-first, zero-LLM agent memory. AliceLabs proprietary."
readme = "README.md"
license = { text = "AliceLabs Proprietary v1.0" }
requires-python = ">=3.10"
authors = [
  { name = "AliceLabs", email = "eddyflores100-lang@users.noreply.github.com" },
]
keywords = [
  "ai", "agents", "memory", "rag", "retrieval", "llm",
  "agent", "integer-pointer", "fidelity",
  "vector-store", "chromadb", "ollama", "mcp", "agent-memory",
  "memex", "alice-labs", "local-first", "zero-llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "License :: Other/Proprietary License",
]
dependencies = [
  "mem0ai>=2.0.0,<3.0",
  "chromadb>=0.5.0",
  # mem0's ollama embedder lazy-imports `ollama`. Without it on PYTHONPATH,
  # mem0 hits an interactive input() prompt at boot, which crashes a
  # non-tty server context (launchd / systemd / MCP) with EOFError. Bundling
  # the client makes a source install non-interactive end-to-end.
  "ollama>=0.4.0",
]

[project.optional-dependencies]
ollama = []  # no extra deps — Ollama runs locally
hybrid = ["bm25s>=0.2"]  # BM25 fusion for recall_hybrid; degrades gracefully if absent
dev = ["pytest", "pytest-asyncio", "httpx", "ruff==0.15.22", "build>=1.2", "anthropic>=0.40"]

[project.scripts]
memex = "memex.cli:main"
memex-server = "memex.server:main"
memex-mcp = "memex.mcp_server:main"
memex-lpci-server = "memex.scaffold_server:main"

[project.urls]
Homepage = "https://github.com/eddyflores100-lang"
Repository = "https://github.com/eddyflores100-lang/memex"
Documentation = "https://github.com/eddyflores100-lang/memex#readme"
Issues = "https://github.com/eddyflores100-lang/memex/issues"
Changelog = "https://github.com/eddyflores100-lang/memex/blob/main/CHANGELOG.md"
Source = "https://github.com/eddyflores100-lang/memex"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

[tool.uv]
# onnxruntime 1.24.1-1.24.3 (pulled in transitively by chromadb) declare
# `requires-python = ">=3.10"` but ship no cp310 wheel and no sdist. uv resolves
# universally across our whole floor, believes that metadata, and then fails to
# install on 3.10; pip backtracks per-interpreter and never sees it. Excluding the
# three mislabelled releases lets uv fork correctly: 1.23.2 on 3.10, latest above.
# Upstream fixed the metadata from 1.24.4 onward.
constraint-dependencies = ["onnxruntime!=1.24.1,!=1.24.2,!=1.24.3"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

markers = ["live: requires explicitly enabled local services"]
addopts = "-m 'not live'"
